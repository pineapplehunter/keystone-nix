name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

permissions:
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          # disabled because the arm runner does not have kvm support
          # https://github.com/actions/runner-images/issues/14062
          # - ubuntu-26.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 720 # 12 hour
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Build niks3
        id: niks3
        run: |
          path=$(nix build nixpkgs#niks3 --print-out-paths --no-link --inputs-from .)
          echo "store-path=$path" >> "$GITHUB_OUTPUT"

      - uses: Mic92/niks3-action@12d3e320b2a99b7938f9634bd337cd9fec104609 # v1.1.0
        with:
          server-url: https://niks3.s.ihavenojob.work
          niks3-bin: ${{ steps.niks3.outputs.store-path }}/bin/niks3

      - name: Run checks
        run: nix flake check --accept-flake-config
