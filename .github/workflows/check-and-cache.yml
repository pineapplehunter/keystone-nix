name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

permissions:
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: "personal nix caching"
    steps:
      - uses: actions/checkout@v5
      - uses: wimpysworld/nothing-but-nix@main
      - uses: cachix/install-nix-action@v31

      - name: Build niks3
        id: niks3
        run: |
          path=$(nix build .#niks3 --print-out-paths --no-link)
          echo "store-path=$path" >> "$GITHUB_OUTPUT"

      - uses: Mic92/niks3-action@12d3e320b2a99b7938f9634bd337cd9fec104609 # v1.1.0
        with:
          server-url: https://niks3.s.ihavenojob.work
          niks3-bin: ${{ steps.niks3.outputs.store-path }}/bin/niks3

      - name: Run checks
        run: nix flake check --keep-going --all-systems --accept-flake-config
